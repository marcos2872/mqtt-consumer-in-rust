[package]
name = "data-ingestion-service"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1.49.0", features = ["full"] }
serde_json = "1.0.149"
serde = "1.0.228"
rumqttc = "0.25.1"
sqlx = { version = "0.8.6", features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "macros"] }
chrono = { version = "0.4.42", features = ["serde"] }
dotenvy = "0.15.7"
thiserror = "2.0.17"
